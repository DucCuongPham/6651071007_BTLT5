<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title>Form tính tiền lương</title>
</head>
<body>
    <h1>Câu 23: Form tính tiền lương</h1>
    <form>
        <table border="1">
            <tr>
                <td><b>Lương</b></td>
                <td>
                    <input type="text" id="luong" value="1000000">
                </td>
            </tr>
            <tr>
                <td><b>Hệ số lương</b></td>
                <td>
                    <input type="number" id="heso" value="3.2" step="0.1">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" value="Tính lương tháng" onclick="tinhLuong()">
                </td>
            </tr>
            <tr>
                <td><b>Lương tháng</b></td>
                <td>
                    <input type="text" id="luongthang" value="3200000">
                </td>
            </tr>
        </table>
    </form>
    <script src="Scripts/cau23.js"></script>
</body>
</html>
