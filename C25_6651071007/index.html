<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tính tiền món ăn</title>
</head>

<body>

<h2 align="center">THỰC ĐƠN</h2>

<form>
    <table border="1" width="100%">
        <tr>
            <th>Thức ăn</th>
            <th>Nước uống</th>
            <th>Thời điểm</th>
        </tr>

        <tr>
            <td>
                <select id="thucAnSelect" multiple size="7">
                    <option value="20000">Bún bò</option>
                    <option value="18000">Hủ tiếu</option>
                    <option value="17000">Bánh canh</option>
                    <option value="20000">Phở bò</option>
                    <option value="15000">Nui</option>
                    <option value="15000">Bánh mì thịt</option>
                    <option value="15000">Bánh cuốn</option>
                </select>
            </td>

            <td>
                <select id="nuocUongSelect" multiple size="7">
                    <option value="12000">Cà phê đá</option>
                    <option value="15000">Cà phê sữa đá</option>
                    <option value="13000">Chanh dây</option>
                    <option value="10000">Chanh muối</option>
                    <option value="10000">Xí muội</option>
                    <option value="10000">Sữa tươi</option>
                    <option value="15000">Cam vắt</option>
                </select>
            </td>

            <td>
                <input type="radio" name="thoidiem" id="banngay" value="0" checked>
                <label for="banngay">Ban ngày</label>
                <br><br>

                <input type="radio" name="thoidiem" id="bannight" value="10">
                <label for="bannight">Ban đêm</label>
            </td>
        </tr>

        <tr>
            <td colspan="3" align="center">
                <input type="button" value="Tính tiền" onclick="tinhTien()">
            </td>
        </tr>
    </table>

    <br>

    <table border="1" width="500" id="ketqua">
        <tr>
            <th>Các món đã dùng</th>
            <th>Tiền</th>
        </tr>
    </table>
</form>

<script src="Scripts/cau25.js"></script>
<link rel="stylesheet" href="Styles/style.css">

</body>
</html>
